<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATL Launcher</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3l12 7v12l-12 7L4 22V10z' fill='%239b7cff'/%3E%3Cpath d='M16 3l12 7-12 7L4 10z' fill='%23d4c7ff'/%3E%3Cpath d='M16 17v12L4 22V10z' fill='%235b3fd6'/%3E%3C/svg%3E">
<style>
html,body{background:#0f1117;margin:0}
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#0f1117;color:#e9eaf2;font-family:system-ui,"Segoe UI",sans-serif;transition:opacity .35s}
#splash.out{opacity:0;pointer-events:none}
#splash svg{width:84px;height:84px;animation:sp-pulse 1.8s ease-in-out infinite}
#splash b{font-size:22px;font-weight:700;letter-spacing:-.01em}
#splash i{display:block;width:150px;height:3px;border-radius:3px;background:#222633;overflow:hidden;position:relative}
#splash i::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;border-radius:3px;background:#9b7cff;animation:sp-bar 1.2s ease-in-out infinite}
@keyframes sp-pulse{50%{transform:scale(1.07);opacity:.85}}
@keyframes sp-bar{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="splash"><svg viewBox="0 0 32 32"><path d="M16 3l12 7v12l-12 7L4 22V10z" fill="#9b7cff"/><path d="M16 3l12 7-12 7L4 10z" fill="#bba8ff"/></svg><b>ATL Launcher</b><i></i></div>
<div id="gprog" class="gprog" hidden><i></i></div>
<div id="app">
  <nav class="rail" id="rail" aria-label="Разделы"></nav>
  <main class="main" id="main"><div id="offline" class="offline" hidden>Нет связи с лаунчером. Запусти его снова.</div><div id="view"></div></main>
</div>
<div id="statuspill" class="statuspill" hidden></div>
<div id="modal-root"></div>
<div id="pop-root"></div>
<div id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
