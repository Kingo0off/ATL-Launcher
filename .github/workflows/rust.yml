name: Rust (тесты и .exe)
on:
  push:
    branches: [main]
    paths: ["core/**", "src-tauri/**", "Cargo.toml", "ui/**", ".github/workflows/rust.yml"]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      FL_MS_CLIENT_ID: ${{ vars.FL_MS_CLIENT_ID }}
      FL_CF_API_KEY: ${{ secrets.FL_CF_API_KEY }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Номер версии
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="3.1.${{ github.run_number }}"; fi
          echo "FL_VERSION=$V" >> "$GITHUB_ENV"
          echo "VERSION_TAG=v$V" >> "$GITHUB_ENV"
      - name: Тесты ядра
        run: |
          set -o pipefail
          cargo test -p friendlauncher-core --color never 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Сетевой тест туннеля (не блокирует сборку)
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test -p friendlauncher-core --test room_net --color never -- --ignored --nocapture 2>&1 | tee "$RUNNER_TEMP/net.log"
      - name: Сборка .exe
        run: |
          set -o pipefail
          cargo build --release -p friendlauncher --color never 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Имя файла для скачивания
        run: cp target/release/friendlauncher.exe ATL-Launcher.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ATL-Launcher-exe
          path: ATL-Launcher.exe
      - name: Описание релиза (из сообщения коммита, без служебных строк)
        if: github.event_name == 'push'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: printf '%s\n' "$COMMIT_MSG" | grep -v -i -E '^(Co-Authored-By|Claude-Session):|Generated with \[Claude Code\]' > release_body.md || true
      - name: Релиз (из него лаунчер сам берёт обновления)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          target_commitish: ${{ github.sha }}
          name: ATL Launcher ${{ env.FL_VERSION }}
          make_latest: "true"
          body_path: release_body.md
          files: ATL-Launcher.exe
      - name: Журнал в ветку ci-logs (чтобы разработчик мог его прочитать)
        if: always()
        run: |
          set +e
          {
            echo "commit: $GITHUB_SHA"
            echo "job status: ${{ job.status }}"
            echo "=== тесты ==="; touch "$RUNNER_TEMP/test.log" "$RUNNER_TEMP/build.log"; grep -v "^\s*\(Compiling\|Downloaded\|Downloading\)" "$RUNNER_TEMP/test.log" 2>/dev/null | tail -n 400
            echo "=== сеть ==="; touch "$RUNNER_TEMP/net.log"; grep -v "^\s*\(Compiling\|Downloaded\|Downloading\)" "$RUNNER_TEMP/net.log" 2>/dev/null | tail -n 60
            echo "=== сборка ==="; grep -v "^\s*\(Compiling\|Downloaded\|Downloading\)" "$RUNNER_TEMP/build.log" 2>/dev/null | tail -n 300
          } > "$RUNNER_TEMP/ci-log.txt"
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock" 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          set -e
          git checkout --orphan ci-logs
          git rm -rf . -q
          cp "$RUNNER_TEMP/ci-log.txt" ci-log.txt
          cp "$RUNNER_TEMP/Cargo.lock" Cargo.lock 2>/dev/null || true
          git add ci-log.txt Cargo.lock 2>/dev/null || git add ci-log.txt
          git commit -q -m "ci log for $GITHUB_SHA"
          git push -f origin ci-logs
