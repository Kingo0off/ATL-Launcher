name: Сборка FriendLauncher.exe
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --noconsole --onefile --name FriendLauncher --add-data "launcher/web;launcher/web" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: FriendLauncher-exe
          path: dist/FriendLauncher.exe
      - name: Приложить к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FriendLauncher.exe
